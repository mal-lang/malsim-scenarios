lang_file: ../../../langs/org.mal-lang.tyrLang-0.0.7.mar
model_file: model.yml
agents:
  Attacker1:
    type: attacker
    entry_points:
    - WWW:fullAccess
    agent_class: BreadthFirstAttacker
    rewards:
      by_asset_name:
        secretApp:
          fullAccess: 1000
    actionable_steps:
      by_asset_type:
        Application:
        - notPresent
        ConnectionRule:
        - restricted
        Identity:
        - notPresent
  Defender1:
    type: defender
    agent_class: PassiveAgent
    rewards:
      by_asset_name:
        secretApp:
          fullAccess: 1000
    actionable_steps:
      by_asset_type:
        Application:
        - notPresent
        ConnectionRule:
        - restricted
        Identity:
        - notPresent
    observable_steps:
      by_asset_type:
        ConnectionRule:
        - attemptConnectToApplications
        - attemptAccessNetworks
        Application:
        - fullAccess
        - notPresent
        - networkConnect
        Credentials:
        - attemptGuessCredentials

